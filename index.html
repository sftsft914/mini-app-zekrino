<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تسبیح دیجیتال هوشمند | ذکرینو (بله)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 500: '#10b981', 600: '#059669', 700: '#047857' },
                        bale: { primary: '#10b981', bg: '#0f172a', card: '#1e293b', border: '#334155' }
                    },
                    fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 4px; }
        .bead-shadow { box-shadow: inset -2px -2px 6px rgba(0,0,0,0.5), 2px 3px 8px rgba(0,0,0,0.3); }
        .glow-effect { box-shadow: 0 0 25px rgba(16, 185, 129, 0.25); }
        #beads-ring { transition: transform .38s cubic-bezier(.22,.85,.32,1.05); }
        .bead-node { transition: r .25s ease; }
        #tasbih-pad.round-complete { animation: round-flash .6s ease; }
        @keyframes round-flash { 0%,100% { box-shadow: inset 0 0 0 0 transparent; } 40% { box-shadow: inset 0 0 46px 8px rgba(16,185,129,0.4); } }
        .toast-pill { opacity: 0; transform: translateY(-12px) scale(.95); transition: opacity .25s ease, transform .25s ease; }
        .toast-pill.show { opacity: 1; transform: translateY(0) scale(1); }
        @keyframes counter-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
        .counter-pulse { animation: counter-pulse .28s ease; }
    </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 overflow-hidden">

    <div id="toast-root" class="fixed top-3 inset-x-0 flex flex-col items-center gap-2 z-50 pointer-events-none px-4"></div>


    <div class="max-w-md mx-auto h-full flex flex-col bg-white dark:bg-slate-900 shadow-2xl relative overflow-hidden">

        <header class="px-4 py-3 flex items-center justify-between border-b border-slate-100 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-20 shrink-0">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg font-bold glow-effect">📿</div>
                <div>
                    <h1 class="font-bold text-sm leading-tight text-slate-900 dark:text-white">تسبیح هوشمند بله</h1>
                    <p class="text-[10px] text-slate-400">ذکر و معنویت دیجیتال</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse">
                <div id="streak-badge" class="flex items-center gap-1 text-[11px] font-bold text-amber-600 dark:text-amber-400 bg-amber-500/10 px-2.5 py-1.5 rounded-full">
                    <i class="fa-solid fa-fire text-[11px]"></i><span id="streak-text">۰</span>
                </div>
                <button onclick="app.toggleTheme()" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto relative pb-20 p-4 flex flex-col justify-between select-none">
            
            <div class="space-y-2 shrink-0">
                <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800/60 p-2.5 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 gap-2">
                    <select id="dhikr-select" onchange="app.changeActiveDhikr(this.value)" class="bg-transparent text-xs font-bold text-slate-800 dark:text-white outline-none flex-1 cursor-pointer">
                    </select>
                    <select id="model-select" onchange="app.changeTasbihModel(this.value)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] px-3 py-1.5 rounded-xl outline-none font-medium transition cursor-pointer">
                        <option value="shahmaghsoudi">🟢 سبز شاه‌مقصودی</option>
                        <option value="aqiq">🔴 عقیق قرمز</option>
                        <option value="firoozeh">🔵 آبی فیروزه‌ای</option>
                        <option value="khaki">🟤 خاکی چوبی</option>
                        <option value="yellow">🟡 زرد کهربایی</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col items-center justify-center my-auto space-y-4">

                <div id="tasbih-pad" onpointerdown="app.incrementCount()" class="relative w-full max-w-[300px] aspect-square mx-auto rounded-full cursor-pointer active:scale-[0.98] transition select-none">
                    <div class="absolute inset-3 rounded-full bg-gradient-to-b from-slate-50 to-slate-100 dark:from-slate-800/50 dark:to-slate-900/60 shadow-inner"></div>
                    <svg id="beads-svg" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 200 200">
                        <defs>
                            <radialGradient id="beadGrad" cx="35%" cy="30%" r="75%">
                                <stop id="beadGradLight" offset="0%" stop-color="#8fd9bd" />
                                <stop id="beadGradDark" offset="100%" stop-color="#0f4633" />
                            </radialGradient>
                            <radialGradient id="beadGradGold" cx="35%" cy="30%" r="75%">
                                <stop offset="0%" stop-color="#f6e3a1" />
                                <stop offset="100%" stop-color="#8a6a1f" />
                            </radialGradient>
                            <filter id="beadGlow" x="-80%" y="-80%" width="260%" height="260%">
                                <feGaussianBlur stdDeviation="2.4" result="blur" />
                                <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                            </filter>
                        </defs>
                        <circle cx="100" cy="100" r="82" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 6" class="text-emerald-500/25" />
                        <polygon points="100,10 94,21 106,21" class="text-emerald-500" fill="currentColor" />
                        <g id="beads-ring"></g>
                    </svg>

                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-8 text-center">
                        <span id="active-dhikr-name" class="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 bg-white/85 dark:bg-slate-900/70 backdrop-blur px-3 py-1 rounded-full mb-1">ذکر صلوات</span>
                        <div id="counter-display" class="text-6xl font-black text-slate-900 dark:text-white leading-none">0</div>
                        <span id="round-info" class="text-[11px] text-slate-400 font-medium mt-1.5 bg-white/70 dark:bg-slate-900/60 backdrop-blur px-2.5 py-0.5 rounded-full">دور ۱ (دانه ۰ از ۳۳)</span>
                    </div>

                    <div class="absolute -bottom-1 inset-x-0 flex justify-center pointer-events-none">
                        <div class="bg-white/80 dark:bg-slate-800/80 backdrop-blur px-3 py-1 rounded-full shadow-sm">
                            <span class="text-[10px] text-slate-500 dark:text-slate-300 font-medium"><i class="fa-solid fa-fingerprint ml-1.5 text-emerald-500"></i>برای ذکر گفتن لمس کنید</span>
                        </div>
                    </div>
                </div>

                <div class="w-full max-w-[320px] bg-slate-100 dark:bg-slate-800/60 p-3 rounded-2xl border border-slate-200/60 dark:border-slate-700/60">
                    <div class="flex justify-between items-center text-xs mb-1.5">
                        <span class="text-slate-400">پیشرفت هدف روزانه</span>
                        <span id="target-percent" class="font-bold text-emerald-600 dark:text-emerald-400">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 dark:bg-slate-700/60 h-2 rounded-full overflow-hidden">
                        <div id="target-progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between items-center text-[10.5px] text-slate-400 mt-2">
                        <span>امروز: <span id="today-count" class="font-bold text-slate-600 dark:text-slate-300">۰</span></span>
                        <span>مجموع کل: <span id="lifetime-count" class="font-bold text-slate-600 dark:text-slate-300">۰</span></span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2 px-2 py-3 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 shrink-0">
                <button onclick="app.undoCount()" class="flex flex-col items-center justify-center py-1 text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition">
                    <i class="fa-solid fa-rotate-left text-sm mb-1"></i><span class="text-[10px]">کاهش</span>
                </button>
                <button onclick="app.toggleSound()" id="sound-btn" class="flex flex-col items-center justify-center py-1 text-emerald-600 transition">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-sm mb-1"></i><span class="text-[10px]">صدا</span>
                </button>
                <button onclick="app.toggleVibrate()" id="vibe-btn" class="flex flex-col items-center justify-center py-1 text-emerald-600 transition">
                    <i id="vibe-icon" class="fa-solid fa-mobile-screen-button text-sm mb-1"></i><span class="text-[10px]">لرزش</span>
                </button>
                <button onclick="app.resetCounter()" class="flex flex-col items-center justify-center py-1 text-red-500 hover:text-red-600 transition">
                    <i class="fa-solid fa-rotate text-sm mb-1"></i><span class="text-[10px]">صفر</span>
                </button>
            </div>

        </main>
    </div>

    <script>
        const TASBIH_MODELS = {
            shahmaghsoudi: { name: 'سبز شاه‌مقصودی', color: '#15803d', shadow: 'rgba(21, 128, 61, 0.4)' },
            aqiq: { name: 'عقیق قرمز', color: '#b91c1c', shadow: 'rgba(185, 28, 28, 0.4)' },
            firoozeh: { name: 'آبی فیروزه‌ای', color: '#0ea5e9', shadow: 'rgba(14, 165, 233, 0.4)' },
            khaki: { name: 'خاکی چوبی', color: '#a16207', shadow: 'rgba(161, 98, 7, 0.4)' },
            yellow: { name: 'زرد کهربایی', color: '#eab308', shadow: 'rgba(234, 179, 8, 0.4)' }
        };

        const ACHIEVEMENTS = [
            { id: 'a100', value: 100, label: '🥉 اولین ۱۰۰ ذکر' },
            { id: 'a1000', value: 1000, label: '🥈 اولین ۱٬۰۰۰ ذکر' },
            { id: 'a10000', value: 10000, label: '🥇 اولین ۱۰٬۰۰۰ ذکر' },
            { id: 'a100000', value: 100000, label: '💎 ۱۰۰٬۰۰۰ ذکر' }
        ];

        const DEFAULT_STATE = {
            user: { theme: 'dark' },
            activeDhikrId: 'd-1',
            settings: {
                tasbihModel: 'shahmaghsoudi',
                soundEnabled: true,
                vibrationEnabled: true
            },
            streak: { current: 0, longest: 0, lastDate: null },
            unlockedAchievements: [],
            dhikrs: [
                { id: 'd-1', name: 'صلوات بر محمد و آل محمد', target: 100, beadCount: 33, count: 0, lifetimeCount: 0, history: {}, lastActiveDate: null },
                { id: 'd-2', name: 'استغفار (استغفرالله ربی)', target: 100, beadCount: 33, count: 0, lifetimeCount: 0, history: {}, lastActiveDate: null },
                { id: 'd-3', name: 'سبحان‌الله و الحمدلله', target: 33, beadCount: 33, count: 0, lifetimeCount: 0, history: {}, lastActiveDate: null },
                { id: 'd-4', name: 'یا الله / یا رحمان', target: 100, beadCount: 33, count: 0, lifetimeCount: 0, history: {}, lastActiveDate: null }
            ]
        };

        class BaleZekrinoApp {
            constructor() {
                this.state = this.loadState();
            }

            loadState() {
                const saved = localStorage.getItem('bale_zekrino_state');
                if (!saved) return JSON.parse(JSON.stringify(DEFAULT_STATE));
                try {
                    const parsed = JSON.parse(saved);
                    // migrate older saved data that predates streaks/history/achievements
                    parsed.streak = parsed.streak || { current: 0, longest: 0, lastDate: null };
                    parsed.unlockedAchievements = parsed.unlockedAchievements || [];
                    parsed.dhikrs = (parsed.dhikrs || []).map(d => ({
                        lifetimeCount: 0, history: {}, lastActiveDate: null, ...d
                    }));
                    return parsed;
                } catch (e) {
                    console.warn('corrupted saved data, starting fresh:', e);
                    return JSON.parse(JSON.stringify(DEFAULT_STATE));
                }
            }

            saveState() {
                localStorage.setItem('bale_zekrino_state', JSON.stringify(this.state));
            }

            init() {
                this.applyTheme();
                this.rolloverAll();
                this.populateDropdowns();
                this.checkVibrationSupport();
                this.updateUI();

                // re-center the bead ring if the layout size changes (rotation, resize)
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => this.updateUI(), 120);
                });

                // if the mini-app stays open across midnight, catch the date change
                setInterval(() => {
                    const changed = this.rolloverAll();
                    if (changed) { this.populateDropdowns(); this.updateUI(); }
                }, 5 * 60 * 1000);

                // helpful for debugging inside the real Bale app: open devtools/remote
                // inspector and check this log to see what bridge object Bale exposes
                console.log('[Zekrino] window.Bale bridge object:', window.Bale);
            }

            // ---- date helpers ----
            todayKey() {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }
            keyFromDate(d) {
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }

            // Archives yesterday's tally into history + lifetime total, then resets the
            // daily counter to 0. This is what makes "پیشرفت هدف روزانه" actually mean
            // *today's* progress instead of being stuck at 100% forever after day one.
            rolloverIfNeeded(d) {
                const today = this.todayKey();
                if (!d.lastActiveDate) { d.lastActiveDate = today; return null; }
                if (d.lastActiveDate === today) return null;
                d.history = d.history || {};
                d.history[d.lastActiveDate] = d.count;
                const reachedGoal = d.target > 0 && d.count >= d.target;
                d.lifetimeCount = (d.lifetimeCount || 0) + d.count;
                const archivedDate = d.lastActiveDate;
                d.count = 0;
                d.lastActiveDate = today;
                return { archivedDate, reachedGoal };
            }

            rolloverAll() {
                let anyGoalDay = null;
                let changed = false;
                this.state.dhikrs.forEach(d => {
                    const res = this.rolloverIfNeeded(d);
                    if (res) { changed = true; if (res.reachedGoal) anyGoalDay = res.archivedDate; }
                });
                if (anyGoalDay) this.updateStreak(anyGoalDay);
                if (changed) this.saveState();
                return changed;
            }

            updateStreak(dateStr) {
                const s = this.state.streak;
                const prev = new Date(dateStr + 'T00:00:00');
                prev.setDate(prev.getDate() - 1);
                const prevKey = this.keyFromDate(prev);
                if (s.lastDate === prevKey) {
                    s.current += 1;
                } else if (s.lastDate !== dateStr) {
                    s.current = 1;
                }
                s.longest = Math.max(s.longest || 0, s.current);
                s.lastDate = dateStr;
            }

            checkAchievements() {
                const total = this.state.dhikrs.reduce((sum, d) => sum + (d.lifetimeCount || 0) + (d.count || 0), 0);
                ACHIEVEMENTS.forEach(a => {
                    if (total >= a.value && !this.state.unlockedAchievements.includes(a.id)) {
                        this.state.unlockedAchievements.push(a.id);
                        this.showToast(`دستاورد جدید: ${a.label}`);
                    }
                });
            }

            showToast(message) {
                const root = document.getElementById('toast-root');
                const el = document.createElement('div');
                el.className = 'toast-pill bg-white/95 dark:bg-slate-800/95 text-slate-800 dark:text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg border border-slate-200 dark:border-slate-700';
                el.textContent = message;
                root.appendChild(el);
                requestAnimationFrame(() => el.classList.add('show'));
                setTimeout(() => {
                    el.classList.remove('show');
                    setTimeout(() => el.remove(), 250);
                }, 2800);
            }

            // lightens (positive percent) or darkens (negative percent) a hex color —
            // used to build the 3D-ish radial gradient shading on each bead
            shadeColor(hex, percent) {
                hex = hex.replace('#', '');
                const num = parseInt(hex, 16);
                let r = (num >> 16) + Math.round(2.55 * percent);
                let g = ((num >> 8) & 0xff) + Math.round(2.55 * percent);
                let b = (num & 0xff) + Math.round(2.55 * percent);
                r = Math.max(0, Math.min(255, r));
                g = Math.max(0, Math.min(255, g));
                b = Math.max(0, Math.min(255, b));
                return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
            }

            checkVibrationSupport() {
                const hasBaleBridge = !!(window.Bale && (window.Bale.vibrate || window.Bale.WebApp?.HapticFeedback));
                const hasWebVibrate = !!(window.navigator && window.navigator.vibrate);
                this.vibrationSupported = hasBaleBridge || hasWebVibrate;
                const vibeBtn = document.getElementById('vibe-btn');
                if (!this.vibrationSupported) {
                    vibeBtn.classList.add('opacity-40');
                    vibeBtn.title = 'لرزش در این مرورگر/دستگاه پشتیبانی نمی‌شود';
                }
            }

            applyTheme() {
                const html = document.documentElement;
                if (this.state.user.theme === 'dark') {
                    html.classList.add('dark');
                    document.getElementById('theme-icon').className = 'fa-solid fa-sun';
                } else {
                    html.classList.remove('dark');
                    document.getElementById('theme-icon').className = 'fa-solid fa-moon';
                }
            }

            toggleTheme() {
                this.state.user.theme = this.state.user.theme === 'light' ? 'dark' : 'light';
                this.saveState();
                this.applyTheme();
            }

            populateDropdowns() {
                const dhikrSelect = document.getElementById('dhikr-select');
                dhikrSelect.innerHTML = this.state.dhikrs.map(d => `
                    <option value="${d.id}" ${d.id === this.state.activeDhikrId ? 'selected' : ''}>${d.name} (امروز ${d.count})</option>
                `).join('');

                document.getElementById('model-select').value = this.state.settings.tasbihModel;
            }

            updateUI() {
                const activeDhikr = this.state.dhikrs.find(d => d.id === this.state.activeDhikrId) || this.state.dhikrs[0];
                const modelInfo = TASBIH_MODELS[this.state.settings.tasbihModel];
                const beadCount = activeDhikr.beadCount;
                // 0-based position within the current round; count=beadCount -> last bead (correct),
                // count=beadCount+1 -> wraps cleanly to 0 (start of next round)
                const posInRound = activeDhikr.count > 0 ? ((activeDhikr.count - 1) % beadCount + beadCount) % beadCount : 0;
                const roundNum = activeDhikr.count > 0 ? Math.floor((activeDhikr.count - 1) / beadCount) + 1 : 1;
                const beadNumberDisplay = activeDhikr.count > 0 ? posInRound + 1 : 0;

                // Update text elements
                document.getElementById('counter-display').innerText = activeDhikr.count;
                document.getElementById('active-dhikr-name').innerText = activeDhikr.name;
                document.getElementById('round-info').innerText = `دور ${roundNum} (دانه ${beadNumberDisplay} از ${beadCount})`;

                // Update progress bar — activeDhikr.count is now the *daily* counter
                // (see rolloverIfNeeded), so this genuinely reflects today's progress
                const percent = Math.min(100, Math.round((activeDhikr.count / activeDhikr.target) * 100));
                document.getElementById('target-percent').innerText = `${percent}%`;
                document.getElementById('target-progress-bar').style.width = `${percent}%`;
                document.getElementById('today-count').innerText = activeDhikr.count;
                document.getElementById('lifetime-count').innerText = (activeDhikr.lifetimeCount || 0) + activeDhikr.count;

                // Streak badge
                document.getElementById('streak-text').innerText = `${this.state.streak.current || 0} روز`;

                // Update Sound & Vibrate buttons state
                document.getElementById('sound-btn').className = `flex flex-col items-center justify-center py-1 transition ${this.state.settings.soundEnabled ? 'text-emerald-600' : 'text-slate-400'}`;
                document.getElementById('vibe-btn').className = `flex flex-col items-center justify-center py-1 transition ${this.state.settings.vibrationEnabled ? 'text-emerald-600' : 'text-slate-400'}`;

                this.renderBeadsRing(activeDhikr, modelInfo, posInRound);
            }

            // Draws a full circular necklace of beads and *rotates the whole ring* so the
            // active bead always lands under the fixed pointer notch at the top — this is
            // what gives the genuine "spinning tasbih" feeling, and there are no open/empty
            // ends since it's a closed loop.
            renderBeadsRing(activeDhikr, modelInfo, posInRound) {
                const beadCount = activeDhikr.beadCount;
                const N = Math.min(beadCount, 45); // cap purely for visual clarity on large custom counts
                const ringIndex = Math.min(N - 1, Math.round((posInRound / beadCount) * N));

                document.getElementById('beadGradLight').setAttribute('stop-color', this.shadeColor(modelInfo.color, 40));
                document.getElementById('beadGradDark').setAttribute('stop-color', this.shadeColor(modelInfo.color, -35));

                const cx = 100, cy = 100, r = 82;
                let svg = '';
                for (let i = 0; i < N; i++) {
                    const angle = -Math.PI / 2 + (i / N) * Math.PI * 2;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    const isImam = i === 0; // the larger "marker" bead, like a real tasbih's separator bead
                    const isActive = i === ringIndex;
                    const radius = isActive ? 12 : (isImam ? 9.5 : 7.2);
                    const fillUrl = isImam ? 'url(#beadGradGold)' : 'url(#beadGrad)';
                    const filterAttr = isActive ? 'filter="url(#beadGlow)"' : '';
                    const strokeAttr = isActive ? 'stroke="#ffffff" stroke-width="1.3" stroke-opacity="0.85"' : '';
                    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius}" fill="${fillUrl}" ${filterAttr} ${strokeAttr} class="bead-node"></circle>`;
                }
                const ring = document.getElementById('beads-ring');
                ring.innerHTML = svg;
                ring.style.transformOrigin = '100px 100px';
                ring.style.transform = `rotate(${-(ringIndex * 360 / N)}deg)`;
            }

            incrementCount() {
                const activeDhikr = this.state.dhikrs.find(d => d.id === this.state.activeDhikrId);
                if (!activeDhikr) return;

                activeDhikr.count++;
                this.checkAchievements();
                this.saveState();
                this.updateUI();
                this.populateDropdowns();

                if (this.state.settings.vibrationEnabled) {
                    this.hapticFeedback();
                }
                if (this.state.settings.soundEnabled) {
                    this.playClickSound();
                }

                // Smooth pulse animation on counter
                const counter = document.getElementById('counter-display');
                counter.classList.remove('counter-pulse');
                void counter.offsetWidth; // restart animation even on rapid repeated taps
                counter.classList.add('counter-pulse');

                // subtle flash + goal toast when the daily target is hit exactly now
                if (activeDhikr.count === activeDhikr.target) {
                    this.showToast(`🎉 هدف امروز «${activeDhikr.name}» کامل شد`);
                }

                // subtle flash when a round completes
                if (activeDhikr.count % activeDhikr.beadCount === 0) {
                    const pad = document.getElementById('tasbih-pad');
                    pad.classList.add('round-complete');
                    setTimeout(() => pad.classList.remove('round-complete'), 600);
                }
            }

            // Tries, in order: Bale's mini-app haptic bridge (if this page is opened
            // inside the actual Bale app), then the standard Web Vibration API,
            // then fails silently. Standard navigator.vibrate() only works on
            // Android Chrome/WebView with vibrate permission — it is NOT supported
            // on iOS Safari/WebView at all (Apple has never implemented it), and it
            // can also be silently blocked inside some in-app WebViews.
            hapticFeedback() {
                try {
                    if (window.Bale && window.Bale.WebApp && window.Bale.WebApp.HapticFeedback
                        && typeof window.Bale.WebApp.HapticFeedback.impactOccurred === 'function') {
                        window.Bale.WebApp.HapticFeedback.impactOccurred('light');
                        return true;
                    }
                    if (window.Bale && typeof window.Bale.vibrate === 'function') {
                        window.Bale.vibrate(30);
                        return true;
                    }
                    if (window.navigator && typeof window.navigator.vibrate === 'function') {
                        return window.navigator.vibrate(30);
                    }
                } catch (e) {
                    console.warn('haptic feedback failed:', e);
                }
                return false;
            }

            undoCount() {
                const activeDhikr = this.state.dhikrs.find(d => d.id === this.state.activeDhikrId);
                if (activeDhikr && activeDhikr.count > 0) {
                    activeDhikr.count--;
                    this.saveState();
                    this.updateUI();
                    this.populateDropdowns();
                }
            }

            resetCounter() {
                if (confirm('شمارش امروز این ذکر صفر می‌شود (مجموع کل و دستاوردهای شما حفظ می‌ماند). ادامه می‌دهید؟')) {
                    const activeDhikr = this.state.dhikrs.find(d => d.id === this.state.activeDhikrId);
                    if (activeDhikr) {
                        activeDhikr.count = 0;
                        this.saveState();
                        this.updateUI();
                        this.populateDropdowns();
                    }
                }
            }

            changeActiveDhikr(id) {
                this.state.activeDhikrId = id;
                this.saveState();
                this.updateUI();
            }

            changeTasbihModel(modelKey) {
                this.state.settings.tasbihModel = modelKey;
                this.saveState();
                this.updateUI();
            }

            toggleSound() {
                this.state.settings.soundEnabled = !this.state.settings.soundEnabled;
                this.saveState();
                this.updateUI();
            }

            toggleVibrate() {
                this.state.settings.vibrationEnabled = !this.state.settings.vibrationEnabled;
                this.saveState();
                this.updateUI();
            }

            playClickSound() {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                } catch (e) {}
            }
        }

        const app = new BaleZekrinoApp();
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
